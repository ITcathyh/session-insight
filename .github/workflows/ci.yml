name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build, type check, lint, and test
        run: pnpm exec turbo build typecheck lint test

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        # No cache-dependency-path: the module has zero third-party
        # dependencies, so there is no go.sum to key a cache on.
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Verify the module stays dependency-free
        # Session Insight runs on a user's own machine against their own
        # session logs. A third-party dependency creeping in would widen the
        # supply-chain surface of a tool that reads private transcripts, so
        # this fails the build rather than letting it land quietly.
        run: |
          cd server
          if [ -s go.sum ]; then
            echo "go.sum is non-empty — a third-party dependency was added." >&2
            exit 1
          fi

      - name: Build
        run: cd server && go build ./...

      - name: Vet
        run: cd server && go vet ./...

      - name: Test
        run: cd server && go test ./...

      - name: Setup Node.js for sync integration tests
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test sync against a real server
        run: node --test scripts/sync-session-insight.test.mjs
